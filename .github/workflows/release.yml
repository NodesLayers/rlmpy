name: Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate release tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z, got: $tag"
            exit 1
          fi
          echo "PACKAGE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build setuptools_scm

      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.PACKAGE_VERSION }}
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
